<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Etch a Sketch</title>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>Etch a Sketch</h1>
        </div>
        <div class="wrapper">
            <div class="searchButton">
                <input class="input" type="text" placeholder="Size of board" value="16" onchange="changeSize(this.value)">
                <button class="button size">Set size</button>
            </div>
            <div class="sketchBoard"></div>
            <div class="buttons">
                <button class="button black" onclick="changeColor('black')">Black</button>
                <button class="button gray" onclick="changeColor('gray')">Gray</button>
                <button class="button eraser" onclick="changeColor('white')">Eraser</button>
                <button class="button rainbow" onclick="changeColor('rainbow')">Rainbow</button>
                <button class="button reset" onclick="reset()">Reset</button>
                
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
