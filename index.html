<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Etch a Sketch</title>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>Etch a Sketch</h1>
        </div>
        <div class="wrapper">
            <div class="sketchBoard"></div>
            <div class="buttons">
                <button class="button black">Black</button>
                <button class="button gray">Gray</button>
                <button class="button eraser">Eraser</button>
                <button class="button rainbow">Rainbow</button>
                <button class="button reset">Reset</button>
                <div>
                    <input class="input" type="text" placeholder="Size of board" value="16"  onchange="changeSize(this.value)">
                    <button class="button size">Set size</button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
